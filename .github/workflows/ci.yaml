name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

# go.work asks for Go 1.27, which only the example needs: it runs kanna-validate,
# which reads JSON with encoding/json/v2. The module itself is tested and built
# without it, on the Go its go.mod names.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.work

      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0

      - name: Lint the example
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          working-directory: example

  test:
    strategy:
      matrix:
        include:
          - go-version-file: go.mod
          - go-version: stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ matrix.go-version-file }}
          go-version: ${{ matrix.go-version }}

      - name: Run tests
        run: make test GOWORK=off

      - name: Upload coverage to Codecov
        if: matrix.go-version-file == 'go.mod'
        uses: codecov/codecov-action@v7.1.1
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Run build
        run: make build GOWORK=off

  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.work

      - name: Regenerate the example
        run: make example

      - name: Check the example is up to date
        run: |
          if [ -n "$(git status --porcelain -- example)" ]; then
            echo "::error::the example is stale; run 'make example' and commit the result"
            git status --porcelain -- example
            git diff -- example
            exit 1
          fi
